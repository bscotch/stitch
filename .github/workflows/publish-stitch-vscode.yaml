name: Stitch for VSCode

# Called by the Release workflow when `bscotch-stitch-vscode` is tagged by
# `pnpm bump`. Can also be run manually.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit (or tag) to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit (or tag) to publish (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # VS Marketplace Trusted Publishing (OIDC)
    steps:
      # SETUP
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - run: corepack enable

      - run: pnpm install --frozen-lockfile --filter=bscotch-stitch-vscode... --filter=@local/stitch-monorepo

      # BUILD DEPS
      - name: Build
        run: pnpm run -r --filter=bscotch-stitch-vscode... build

      # PUBLISH
      # Retried, since getting the OIDC token sometimes fails with a transient
      # GitHub error (e.g. "504 Gateway Timeout"). With `--skip-duplicate`, a
      # version that's already published counts as success, so retries (and
      # re-runs) are safe even if an earlier attempt got as far as publishing.
      - name: Publish
        working-directory: packages/vscode
        run: |
          for attempt in 1 2 3; do
            pnpm vscode:publish --oidc --skip-duplicate && exit 0
            echo "::warning::Publish attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1
