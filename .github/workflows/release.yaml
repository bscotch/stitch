  #     !cancelled() && needs.plan.result == 'success'
  #     && needs.test.result == 'success'
  #     && needs.publish-npm.result != 'failure'
  #     && contains(fromJSON(needs.plan.outputs.tagged), 'crashlands-editor')
  #   uses: ./.github/workflows/publish-cl2-editor.yaml
  #   with:
  #     ref: ${{ needs.plan.outputs.ref }}
  #   secrets: inherit

