# Publishes packages versioned by `pnpm bump`.
#
# `pnpm bump` pushes a single "bumped: ..." commit to develop, along with a
# `<name>@<version>` tag for every bumped project, in one atomic push. This
# workflow triggers on that branch push (not on the tags: GitHub creates no
# tag events when more than 3 tags are pushed at once), finds the tags, and:
# - runs the full test suite (nothing is published if it fails)
# - builds and publishes public packages to npm (Trusted Publishing)
# - triggers other publishing workflows for tagged private projects
#
# To retry a failed release, push any fixes to develop and use "Run workflow"
# (on develop, leaving the ref blank). It releases the newest bump commit at
# or before the ref, but tests, builds, and publishes the code at the ref.
# Versions that are already published are skipped, so retry as often as
# needed.
name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to release from (defaults to the selected branch). Releases the newest bump at or before it.
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    # Pushes that aren't from `pnpm bump` have nothing to release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'bumped:')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      tagged: ${{ steps.plan.outputs.tagged }}
      publish: ${{ steps.plan.outputs.publish }}
      filters: ${{ steps.plan.outputs.filters }}
      has_publish: ${{ steps.plan.outputs.has_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - name: Plan release
        id: plan
        env:
          INPUT_REF: ${{ inputs.ref || github.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/release-plan.mts --ref "$INPUT_REF"
          else
            node scripts/release-plan.mts --before "$BEFORE" --after "$AFTER"
          fi

  # Tests everything at the release commit, not just the packages being
  # published: unpublished workspace deps get bundled into other projects
  # (e.g. the VSCode extension), and the release scripts themselves matter.
  test:
    name: Test
    needs: plan
    if: needs.plan.outputs.ref != ''
    runs-on: windows-latest
    env:
      # The npm libraries (and their workspace deps). The site and editor
      # extensions have no tests and are slow to build.
      FILTERS: --filter=@bscotch/*... --filter=!@bscotch/stitch-site
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          lfs: true # Test samples include LFS-tracked images
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --filter=@local/stitch-monorepo $FILTERS

      - name: Test release scripts
        run: pnpm typecheck:scripts && pnpm test:scripts

      # Tests run from TypeScript source, but import workspace dependencies
      # from their built output.
      - name: Build
        run: pnpm run -r $FILTERS build

      - name: Test
        run: pnpm run -r --if-present $FILTERS test

  publish-npm:
    name: Publish to npm
    needs: [plan, test]
    if: needs.plan.outputs.has_publish == 'true'
    runs-on: windows-latest
    # Serialize publishing (without cancelling queued releases)
    concurrency:
      group: release-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1+, but Node 22 bundles npm 10
      - name: Update npm
        run: npm install -g npm@^11.5.1
      - run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --filter=@local/stitch-monorepo ${{ needs.plan.outputs.filters }}

      - name: Build
        run: pnpm run -r ${{ needs.plan.outputs.filters }} build

      - name: Publish
        env:
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: node scripts/publish.mts --json "$PUBLISH"

  publish-vscode:
    name: Publish Stitch for VSCode
    needs: [plan, test, publish-npm]
    # Run even if there was nothing to publish to npm, but not if tests or npm publishing failed
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.test.result == 'success'
      && needs.publish-npm.result != 'failure'
      && contains(fromJSON(needs.plan.outputs.tagged), 'bscotch-stitch-vscode')
    # A called workflow can't be granted more permissions than its caller job has
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-stitch-vscode.yaml
    with:
      ref: ${{ needs.plan.outputs.ref }}

  # The following workflows are in stasis (they live outside of
  # `.github/workflows/`). To re-enable one, move it into `.github/workflows/`
  # and uncomment its job below.

  # publish-cl2-editor:
  #   name: Publish Crashlands Editor
