name: Publish Stitch Website

on:
  workflow_dispatch:
  schedule:
    # https://crontab.guru/#0_6_*_*_1-5
    - cron: "0 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - uses: actions/setup-node@v3
        with:
          node-version: 22.23.5
      - run: corepack enable
      - run: npm run setup:pnpm

      - name: Install Dependencies
        run: pnpm install --filter=@bscotch/gamemaker-releases... --filter=@bscotch/stitch-site...

      - name: Build Deps
        run: pnpm run -r --filter=@bscotch/stitch-site^... build

      # Fails (preventing publishing) if GameMaker's data looks unexpected
      - name: Update Unified Feed
        run: pnpm node scripts/update-unified-feed.mjs
        working-directory: packages/site

      - name: Build
        run: pnpm build
        working-directory: packages/site

      - name: Upload Artifacts
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    needs: [build, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Alert Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook configured"
            exit 1
          fi
          MESSAGE="⚠️ The Stitch site (including the GameMaker releases feed) failed to build or publish, so the published feed may be getting stale. Details: $RUN_URL"
          jq -n --arg content "$MESSAGE" '{content: $content}' | curl -sSf -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
