# Builds and tests the npm library packages (and the release scripts) on
# pull requests and pushes to develop.
name: Test

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The npm libraries (and their workspace deps). The site and editor
  # extensions have no tests and are slow to build.
  FILTERS: --filter=@bscotch/*... --filter=!@bscotch/stitch-site

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # Test samples include LFS-tracked images
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile --filter=@local/stitch-monorepo $FILTERS

      - name: Test release scripts
        run: pnpm typecheck:scripts && pnpm test:scripts

      # Tests run from TypeScript source, but import workspace dependencies
      # from their built output.
      - name: Build
        run: pnpm run -r $FILTERS build

      - name: Test
        run: pnpm run -r --if-present $FILTERS test
