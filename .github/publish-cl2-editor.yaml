# IN STASIS: this workflow is outside of `.github/workflows/`, so it is inactive.
# To re-enable: move it into `.github/workflows/` and uncomment the
# `publish-cl2-editor` job in `.github/workflows/release.yaml`.
name: Crashlands for VSCode

# Called by the Release workflow when `crashlands-editor` is tagged by
# `pnpm bump`. Can also be run manually.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit (or tag) to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Commit (or tag) to publish (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: windows-latest
    steps:
      # SETUP
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - run: corepack enable

      - run: pnpm install --frozen-lockfile --filter=crashlands-editor... --filter=@local/stitch-monorepo

      # BUILD DEPS
      - name: Build
        run: pnpm run -r --filter=crashlands-editor... build

      # PUBLISH
      - name: Publish
        working-directory: packages/cl2-editor
        run: pnpm vscode:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
